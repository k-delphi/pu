name: Deploy React Router v7 (SPA) to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          GITHUB_PAGES: "true" # 👈 关键：触发 vite.config 中的 base 路径设置

      # 👇 关键：React Router v7 框架模式的产物在 build/client
      # 将 index.html 复制为 404.html 以实现 SPA 路由回退
      - name: Create 404.html for SPA fallback
        run: cp build/client/index.html build/client/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./build/client" # 👈 关键：上传 build/client 目录

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
