name: Deploy React Router to GitHub Pages (pnpm)

on:
  push:
    branches: ["master"] # 如果你的默认分支是 main，请改为 main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 👇 新增：安装 pnpm（必须先于 setup-node）
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # 或你的项目使用的 pnpm 版本

      # 👇 设置 Node.js，并指定使用 pnpm 缓存
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm" # 关键：让 setup-node 自动处理 pnpm 缓存

      # 👇 使用 pnpm 安装依赖，--frozen-lockfile 保证 CI 环境与 lockfile 严格一致
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 👇 使用 pnpm 构建，GITHUB_PAGES 环境变量供 Vite 配置读取
      - name: Build
        run: pnpm run build
        env:
          GITHUB_PAGES: "true"

      # 👇 SPA 回退：将 index.html 复制为 404.html
      - name: Create 404.html for SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist" # 你的构建输出目录

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
